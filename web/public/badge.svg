<?xml version="1.0" encoding="UTF-8"?>
<!--
  NexGen Connect verified badge — a single static SVG that verified
  users can download and post to their LinkedIn / Instagram bio /
  Twitter / email signature. The externally-portable status mark
  (Mechanism 1 — status-signal compounding).

  Sized 320×320 (downloads cleanly to any social-platform avatar
  size). Designed to read at small sizes (32px+) where bio badges
  actually appear. High-contrast on both light and dark backgrounds.

  v18 category-presence pass.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 320 320"
  width="320"
  height="320"
  role="img"
  aria-label="NexGen Connect — Verified"
>
  <title>NexGen Connect · Verified</title>

  <!-- Background — pure black, the brand canvas. -->
  <rect width="320" height="320" fill="#000000" rx="48" />

  <!-- Outer ring — single hairline at the perimeter. -->
  <rect
    x="14"
    y="14"
    width="292"
    height="292"
    rx="36"
    fill="none"
    stroke="#1F1F1F"
    stroke-width="1"
  />

  <!-- The N mark — NexGen Connect's wordmark glyph at 1.5x scale.
       Centered horizontally, sits in the upper third so the label
       below has room. The N glyph: down-up-down stroke that
       represents the corridor mechanic. -->
  <g transform="translate(96, 70)">
    <rect width="128" height="128" rx="28" fill="#00DC82" />
    <path
      d="M 32 96 L 32 32 L 96 96 L 96 32"
      stroke="#000000"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </g>

  <!-- Verified · NexGen Connect label, mono uppercase, small,
       generous letter-spacing. -->
  <text
    x="160"
    y="234"
    font-family="JetBrains Mono, ui-monospace, monospace"
    font-size="14"
    font-weight="600"
    letter-spacing="2.4"
    fill="#00DC82"
    text-anchor="middle"
  >VERIFIED</text>

  <text
    x="160"
    y="258"
    font-family="Inter, system-ui, sans-serif"
    font-size="16"
    font-weight="600"
    letter-spacing="-0.4"
    fill="#FAFAFA"
    text-anchor="middle"
  >NexGen Connect</text>

  <!-- Bottom hairline + small "the corridor" italic accent for brand
       voice. Sits at the foot so the badge reads as institutional. -->
  <line
    x1="80"
    y1="278"
    x2="240"
    y2="278"
    stroke="#1F1F1F"
    stroke-width="1"
  />
  <text
    x="160"
    y="296"
    font-family="Instrument Serif, Georgia, serif"
    font-style="italic"
    font-size="13"
    letter-spacing="-0.2"
    fill="#A1A1A1"
    text-anchor="middle"
  >the corridor</text>
</svg>
