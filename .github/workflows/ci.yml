name: CI

# CI pipeline for the NexGen Connect monorepo. Runs on every push +
# pull request. Each workspace runs typecheck + lint + (web only) build
# in parallel jobs so a slow job doesn't block the rest. Turborepo
# remote caching is wired in once we have the team token; until then,
# each job pays its own install cost (~40s).
#
# What this catches:
#   - TS errors in any workspace
#   - eslint errors in web
#   - web build failure (Vercel-equivalent compile path)
#   - mobile bundle break (Metro can resolve shared workspace)
#
# What it does NOT catch (yet, separate workflow):
#   - Visual regressions (Playwright snapshot tests, Phase 5 polish)
#   - Mobile e2e (Maestro tests, Phase 1 once auth flow lands)
#   - Pen-test-equivalent SAST (Aug 2026 pre-launch external audit)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shared:
    name: Shared typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace=@nexgen-connect/shared

  region-guard:
    name: Supabase region drift guard
    runs-on: ubuntu-latest
    # Why: this repo's Supabase project was migrated from us-east-1
    # (Virginia) to ap-south-1 (Mumbai) for DPDP compliance + India
    # latency. Any future env-var swap that points NEXT_PUBLIC_SUPABASE_URL
    # at a non-Mumbai project moves PII back across the Pacific. CI
    # blocks any merge that would do that.
    #
    # The expected project ref is committed (not secret — it's the
    # public part of the Supabase URL). The actual URL is a public env
    # var pulled from the Vercel-Supabase integration.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify NEXT_PUBLIC_SUPABASE_URL points at Mumbai project
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_EXPECTED_PROJECT_REF: qjxueirmhsbjtnnmuoim
        run: npx tsx tools/check-supabase-region.ts

  web:
    name: Web (typecheck + lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace=@nexgen-connect/web
      - run: npm run lint --workspace=@nexgen-connect/web
      - run: npm run build --workspace=@nexgen-connect/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  mobile:
    name: Mobile (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace=@nexgen-connect/mobile
